<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app-container">

        <!-- Header -->
        <header class="app-header">
            <div class="header-icon">✓</div>
            <h1>My To-Do List</h1>
            <p>Organize your day, one task at a time.</p>
        </header>

        <!-- Add Task Section -->
        <section class="add-task-section" aria-label="Add a new task">

            <label for="taskInput" class="sr-only">
                Enter a new task
            </label>

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
                autocomplete="off"
            >

            <button id="addTaskBtn" type="button">
                + Add Task
            </button>

        </section>

        <!-- Task Lists -->
        <div class="task-lists">

            <!-- Pending Tasks -->
            <section class="task-card pending-card">

                <div class="section-header">
                    <div>
                        <h2>Pending Tasks</h2>
                        <span id="pendingCount">0 pending</span>
                    </div>

                    <div class="section-icon pending-icon">
                        ⏳
                    </div>
                </div>

                <div id="pendingTasks" class="task-list">
                    <!-- Pending tasks appear here -->
                </div>

                <p id="pendingEmpty" class="empty-message">
                    No pending tasks 🎉
                </p>

            </section>


            <!-- Completed Tasks -->
            <section class="task-card completed-card">

                <div class="section-header">
                    <div>
                        <h2>Completed Tasks</h2>
                        <span id="completedCount">0 completed</span>
                    </div>

                    <div class="section-icon completed-icon">
                        ✓
                    </div>
                </div>

                <div id="completedTasks" class="task-list">
                    <!-- Completed tasks appear here -->
                </div>

                <p id="completedEmpty" class="empty-message">
                    No completed tasks yet.
                </p>

            </section>

        </div>

        <!-- Footer -->
        <footer>
            <p>Task 3 • To-Do Web App • Internship Project</p>
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
